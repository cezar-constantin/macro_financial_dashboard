name: Fetch indicator definitions

# Downloads the official definitions (Eurostat glossary, World Bank, IMF, INS, BIS) used for the
# explanations under each chart and commits data/definitions_source.json.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_definitions.py
      - .github/workflows/fetch-definitions.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download definitions
        run: python3 scripts/fetch_definitions.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/definitions_source.json
          if git diff --cached --quiet; then echo "No changes."; else
            git commit -m "Definiții oficiale ale indicatorilor $(date -u +%Y-%m-%d)"
            git push
          fi
