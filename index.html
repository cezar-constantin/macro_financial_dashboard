<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macroeconomia României cu instrumente AI</title>
    <meta name="description" content="Tablou de bord didactic cu indicatorii macroeconomici ai României din surse oficiale (Eurostat, BNR, INS, BIS, FMI, Banca Mondială) și analiză macroeconomică generată în browser." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./macro.css" />
  </head>
  <body>
    <div class="page-shell">
      <nav class="card site-nav" id="site-nav" aria-label="Site"></nav>

      <header class="hero card">
        <div class="hero-copy">
          <p class="eyebrow" data-i18n="home.eyebrow"></p>
          <h1 class="compact" data-i18n="home.title"></h1>
          <p class="hero-text" data-i18n="home.text"></p>
          <div class="hero-flow">
            <span class="flow-chip">RO / EN</span>
            <span class="flow-chip">Eurostat · BNR · INS · BIS · FMI · BM</span>
            <span class="flow-chip" data-i18n="m.pill"></span>
          </div>
        </div>
        <div class="hero-badges">
          <article class="metric-chip"><span class="metric-label" data-i18n="home.series"></span><strong id="hero-series">—</strong></article>
          <article class="metric-chip"><span class="metric-label" data-i18n="home.sources"></span><strong id="hero-sources">—</strong></article>
          <article class="metric-chip"><span class="metric-label" data-i18n="home.updated"></span><strong id="hero-updated">—</strong></article>
        </div>
      </header>

      <section class="tool-grid three-up">
        <article class="card tool-card">
          <p class="section-kicker">1</p>
          <h2 data-i18n="home.dash.title"></h2>
          <p class="helper-copy" data-i18n="home.dash.text"></p>
          <a class="primary-button" href="./tablou.html" data-i18n="home.open"></a>
        </article>
        <article class="card tool-card">
          <p class="section-kicker">2</p>
          <h2 data-i18n="home.report.title"></h2>
          <p class="helper-copy" data-i18n="home.report.text"></p>
          <a class="primary-button" href="./analiza.html" data-i18n="home.open"></a>
        </article>
        <article class="card tool-card">
          <p class="section-kicker">3</p>
          <h2 data-i18n="home.data.title"></h2>
          <p class="helper-copy" data-i18n="home.data.text"></p>
          <a class="primary-button" href="./surse.html" data-i18n="home.open"></a>
        </article>
      </section>

      <section class="card workspace-card">
        <div class="section-heading">
          <div>
            <p class="section-kicker" data-i18n="home.note.kicker"></p>
            <h2 data-i18n="home.note.title"></h2>
          </div>
          <span class="status-pill" data-i18n="m.level"></span>
        </div>
        <p class="helper-copy" data-i18n="home.note.p1"></p>
        <p class="helper-copy" data-i18n="home.note.p2"></p>
        <p class="helper-copy" data-i18n="home.note.p3"></p>
      </section>

      <section class="footer-panel-grid" id="site-footer"></section>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script type="module" src="./home.js"></script>
  </body>
</html>
